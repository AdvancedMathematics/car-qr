<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#cfe9ff">
<title>联系我</title>
<style>
  :root{
    --ink:#12324d;
    --ink-soft:#5b7d99;
    --ink-faint:#8aa8c2;
    --card-bg:rgba(255,255,255,.92);
    --shadow:0 26px 60px -26px rgba(31,95,168,.45);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px 16px calc(28px + env(safe-area-inset-bottom));
    overflow-x:hidden;
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",
                "Microsoft YaHei",system-ui,sans-serif;
    background:linear-gradient(180deg,#cfe9ff 0%,#e8f5ff 46%,#f8fcff 100%);
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- 背景：天空、云、星 ---------- */
  .sky{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
  .glow{
    position:absolute;width:min(560px,120vw);height:min(560px,120vw);
    top:-18%;right:-22%;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.95) 0%,rgba(255,255,255,.45) 42%,rgba(255,255,255,0) 72%);
  }
  .glow.b{top:auto;bottom:-26%;left:-26%;right:auto;
    background:radial-gradient(circle,rgba(198,228,255,.75) 0%,rgba(198,228,255,0) 70%)}

  .cloud{
    position:absolute;height:34px;border-radius:999px;
    background:rgba(255,255,255,.92);
    box-shadow:0 10px 26px -14px rgba(31,95,168,.35);
    animation:drift linear infinite;
  }
  .cloud::before,.cloud::after{
    content:"";position:absolute;border-radius:50%;background:inherit;
  }
  .cloud::before{width:56%;height:150%;left:12%;top:-72%}
  .cloud::after{width:40%;height:120%;right:14%;top:-52%}
  .cloud.c1{width:132px;top:12%;left:-20%;opacity:.9;animation-duration:52s}
  .cloud.c2{width:96px;top:26%;left:-30%;opacity:.72;animation-duration:74s;animation-delay:-22s}
  .cloud.c3{width:168px;top:64%;left:-25%;opacity:.6;animation-duration:96s;animation-delay:-58s}
  .cloud.c4{width:78px;top:80%;left:-18%;opacity:.5;animation-duration:64s;animation-delay:-36s}

  @keyframes drift{
    from{transform:translateX(0)}
    to{transform:translateX(135vw)}
  }

  .stars span{
    position:absolute;width:4px;height:4px;border-radius:50%;
    background:#fff;box-shadow:0 0 8px 2px rgba(255,255,255,.95);
    animation:twinkle 3.6s ease-in-out infinite;
  }
  .stars span::after{
    content:"";position:absolute;inset:-6px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.55) 0%,rgba(255,255,255,0) 70%);
  }
  .stars span:nth-child(1){left:12%;top:14%;animation-delay:0s}
  .stars span:nth-child(2){left:26%;top:8%;animation-delay:.9s;transform:scale(.7)}
  .stars span:nth-child(3){left:74%;top:10%;animation-delay:1.6s}
  .stars span:nth-child(4){left:88%;top:20%;animation-delay:.4s;transform:scale(.8)}
  .stars span:nth-child(5){left:8%;top:38%;animation-delay:2.2s;transform:scale(.6)}
  .stars span:nth-child(6){left:92%;top:44%;animation-delay:1.2s}
  .stars span:nth-child(7){left:18%;top:72%;animation-delay:2.8s;transform:scale(.75)}
  .stars span:nth-child(8){left:82%;top:78%;animation-delay:1.9s;transform:scale(.65)}
  .stars span:nth-child(9){left:46%;top:6%;animation-delay:3.1s;transform:scale(.55)}

  @keyframes twinkle{
    0%,100%{opacity:.35;transform:scale(.85)}
    50%{opacity:1;transform:scale(1.15)}
  }

  /* ---------- 卡片 ---------- */
  .card{
    position:relative;z-index:1;
    width:min(420px,100%);
    padding:34px 28px 26px;
    border-radius:30px;
    background:var(--card-bg);
    border:1px solid rgba(255,255,255,.9);
    box-shadow:var(--shadow),0 0 0 1px rgba(147,190,231,.18) inset;
    backdrop-filter:blur(16px) saturate(1.15);
    -webkit-backdrop-filter:blur(16px) saturate(1.15);
    text-align:center;
    animation:rise .85s cubic-bezier(.22,1,.36,1) both;
  }
  @keyframes rise{
    from{opacity:0;transform:translateY(26px) scale(.98)}
    to{opacity:1;transform:translateY(0) scale(1)}
  }

  .hero{position:relative;display:flex;justify-content:center;margin-bottom:2px}
  .hero-img{
    display:block;width:100%;max-width:220px;height:auto;
    filter:drop-shadow(0 16px 24px rgba(60,110,170,.28));
    animation:bob 5.4s ease-in-out infinite;
  }
  @keyframes bob{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-6px)}
  }

  .eyebrow{
    margin:14px 0 0;font-size:11px;font-weight:700;letter-spacing:.34em;
    text-indent:.34em;color:#8fb6d8;
  }
  h1{
    margin:10px 0 0;font-size:31px;line-height:1.25;font-weight:800;
    letter-spacing:.06em;color:var(--ink);
  }
  .sub{
    margin:10px 0 0;font-size:14px;line-height:1.7;color:var(--ink-soft);
  }

  .phone{
    margin:22px auto 0;padding:16px 30px;display:inline-block;
    border-radius:24px;
    background:linear-gradient(180deg,rgba(246,252,255,.98),rgba(229,243,255,.94));
    border:1px solid rgba(147,190,231,.5);
    box-shadow:0 16px 32px -26px rgba(31,95,168,.95),0 1px 0 #fff inset;
  }
  .phone span{
    display:block;margin-bottom:7px;font-size:10.5px;font-weight:700;
    letter-spacing:.34em;text-indent:.34em;color:#8fb6d8;
  }
  .phone strong{
    display:block;font-size:26px;font-weight:800;letter-spacing:.1em;
    color:#23587f;font-variant-numeric:tabular-nums;
  }

  @media (max-width:380px){
    .card{padding:28px 20px 22px;border-radius:26px}
    h1{font-size:27px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
